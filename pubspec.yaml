name: htl_tecnicos
description: App móvil de HTL Elevadores para técnicos de campo.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.7.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  record: ^7.1.1
  just_audio: ^0.10.6
  geolocator: ^14.1.1
  uuid: ^4.5.1
  intl: ^0.20.2
  connectivity_plus: ^7.3.1
  permission_handler: ^13.0.2
  url_launcher: ^6.3.3
  hand_signature: 3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Misma tipografía que el portal web. Va dentro de la app (no se descarga)
  # para que se vea igual sin señal.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
